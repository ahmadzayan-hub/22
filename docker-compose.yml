services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: os, POSTGRES_USER: os, POSTGRES_PASSWORD: os}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck: {test: ["CMD-SHELL","pg_isready -U os"], interval: 5s, retries: 10}
  redis: {image: redis:7-alpine}
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    # after up: docker compose exec ollama ollama pull bge-m3
    #           docker compose exec ollama ollama pull qwen3:8b   (local stand-in for qwen3.6-hermes)
  whisper:                      # voice ingest (optional profile)
    profiles: ["asr"]
    image: fedirz/faster-whisper-server:latest-cpu
    environment: [WHISPER__MODEL=Systran/faster-whisper-small]
    ports: ["8001:8000"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://os:os@db:5432/os
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-dev-token}
      VAULT_PATH: /vault
      OLLAMA_HOST: http://ollama:11434
    volumes: [./vault:/vault]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8080:8080"]
  web:
    build: ./apps/web
    environment: {NEXT_PUBLIC_API: "http://localhost:8080"}
    depends_on: [api]
    ports: ["3000:3000"]
volumes: {pgdata:, ollama:}
